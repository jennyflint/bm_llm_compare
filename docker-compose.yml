services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull mistral:7b && ollama pull qwen2.5:7b"
    restart: "no"

  llm-bench:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-bench:latest
    container_name: llm-bench
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs
    command:
      - "--config"
      - "/app/config.yaml"
      - "--prompt-file"
      - "/app/prompts/prompt.txt"
      - "--models"
      - "mistral,qwen2.5"
      - "--project"
      - "compose-run"
      - "--ollama-url"
      - "http://ollama:11434"

