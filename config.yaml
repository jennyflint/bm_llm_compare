defaults:
  device: cpu
  cpu_threads: 8
  gpu_layers: 0
  max_tokens: 512
  num_ctx: 4096
  timeout: 120s
  concurrency: 4
  format: table
  no_color: false
  log_dir: logs
  ollama_url: http://localhost:11434

models:
  - name: mistral
    engine: ollama
    model_id: mistral:7b
    cpu_threads: 8
    max_tokens: 512
    num_ctx: 4096
    timeout: 120s

  - name: qwen2.5
    engine: ollama
    model_id: qwen2.5:7b
    cpu_threads: 8
    max_tokens: 512
    num_ctx: 4096
    timeout: 120s

  - name: remote-gpt
    engine: openai
    endpoint: http://localhost:8080
    model_id: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 512
    timeout: 60s
